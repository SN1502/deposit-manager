<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F5C5A">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Track family fixed deposits, interest payment dates and maturity — kept in one Excel workbook.">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; font-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>Deposit Manager</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 96 96'%3E%3Crect width='96' height='96' rx='24' fill='%230F5C5A'/%3E%3Cpath d='M20 38 48 22l28 16' fill='none' stroke='%23fff' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M26 42v26M38 42v26M58 42v26M70 42v26M20 74h56' stroke='%23fff' stroke-width='5' stroke-linecap='round'/%3E%3Ccircle cx='48' cy='55' r='12' fill='%23F2B84B'/%3E%3C/svg%3E">
<style>
/* Deposit Manager — mobile-first styles. Light and dark themes via tokens. */
:root {
  --bg: #f3f5f4;
  --surface: #ffffff;
  --surface-2: #eef2f1;
  --surface-3: #e3e9e7;
  --text: #13201f;
  --text-2: #465756;
  --text-3: #6f7f7d;
  --line: #d9e1df;
  --brand: #0f5c5a;
  --brand-2: #137874;
  --brand-ink: #ffffff;
  --brand-soft: #e0efec;
  --brand-text: #0d5250;
  --gold: #a86b00;
  --gold-soft: #fbf0d9;
  --ok: #1b7a4b;
  --ok-soft: #e1f3e8;
  --warn: #9a5b00;
  --warn-soft: #fdf0d8;
  --danger: #b3261e;
  --danger-soft: #fce8e6;
  --info: #2458a6;
  --info-soft: #e5edf9;
  --shadow: 0 1px 2px rgba(16, 40, 38, .06), 0 2px 8px rgba(16, 40, 38, .06);
  --shadow-lg: 0 8px 32px rgba(10, 30, 28, .22);
  --radius: 16px;
  --radius-sm: 10px;
  --tap: 48px;
  --appbar-h: 56px;
  --tabbar-h: 64px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  color-scheme: light;
}

:root[data-theme="dark"] {
  --bg: #0c1312;
  --surface: #141e1d;
  --surface-2: #1a2726;
  --surface-3: #22302f;
  --text: #e6eeec;
  --text-2: #a8b8b5;
  --text-3: #7e908d;
  --line: #273634;
  --brand: #0f4e4c;
  --brand-2: #3fb0a6;
  --brand-ink: #ffffff;
  --brand-soft: #16312e;
  --brand-text: #6fd0c5;
  --gold: #e7b04a;
  --gold-soft: #2e2512;
  --ok: #5cc98f;
  --ok-soft: #14291e;
  --warn: #e9a94a;
  --warn-soft: #2d2313;
  --danger: #f28b82;
  --danger-soft: #331716;
  --info: #8ab4f8;
  --info-soft: #172336;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3);
  --shadow-lg: 0 8px 32px rgba(0, 0, 0, .5);
  color-scheme: dark;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0;
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", "Noto Sans Tamil", "Helvetica Neue", Arial, sans-serif;
  font-size: 16px;
  line-height: 1.4;
  -webkit-text-size-adjust: 100%;
  overscroll-behavior-y: none;
}

body.locked { overflow: hidden; }

button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--brand-text); }

.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--text-3); }
.small { font-size: 13px; }
.strong { font-weight: 650; }
.nowrap { white-space: nowrap; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

svg.i { width: 22px; height: 22px; flex: none; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; vertical-align: middle; }
svg.i.sm { width: 18px; height: 18px; }
svg.i.lg { width: 28px; height: 28px; }

/* ------------------------------------------------------------ app shell */

#app { min-height: 100%; display: flex; flex-direction: column; }

.appbar {
  position: sticky; top: 0; z-index: 20;
  background: var(--brand); color: var(--brand-ink);
  padding-top: var(--safe-top);
}
.appbar-row { height: var(--appbar-h); display: flex; align-items: center; gap: 4px; padding: 0 6px 0 16px; }
.appbar-row.has-back { padding-left: 4px; }
.appbar h1 { flex: 1; margin: 0; font-size: 20px; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: .1px; }
.icon-btn {
  width: var(--tap); height: var(--tap); border-radius: 50%; border: 0; background: transparent; color: inherit;
  display: inline-flex; align-items: center; justify-content: center; flex: none;
}
.icon-btn:active { background: rgba(255, 255, 255, .16); }
.save-pill {
  display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 16px;
  border: 0; font-size: 13px; font-weight: 600; background: rgba(255, 255, 255, .14); color: inherit; margin-right: 4px;
}
.save-pill .dot { width: 8px; height: 8px; border-radius: 50%; background: #7ee2b0; }
.save-pill.warn .dot { background: #ffc857; }
.save-pill.err .dot { background: #ff8a80; }
.save-pill.busy .dot { background: #cfe; animation: pulse 1s infinite; }
@keyframes pulse { 50% { opacity: .3; } }

main#main {
  flex: 1; width: 100%; max-width: 720px; margin: 0 auto;
  padding: 16px 16px calc(var(--tabbar-h) + var(--safe-bottom) + 88px);
}
body.no-tabs main#main { padding-bottom: calc(var(--safe-bottom) + 96px); }

.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: var(--safe-bottom);
  display: flex; justify-content: center;
}
.tabbar-inner { display: flex; width: 100%; max-width: 720px; }
.tab {
  flex: 1; height: var(--tabbar-h); border: 0; background: none; color: var(--text-3);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  font-size: 12px; font-weight: 600; position: relative;
}
.tab .pill { display: flex; align-items: center; justify-content: center; width: 56px; height: 30px; border-radius: 15px; }
.tab.on { color: var(--brand-text); }
.tab.on .pill { background: var(--brand-soft); }
.tab .badge {
  position: absolute; top: 6px; left: calc(50% + 8px); min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px;
  background: var(--danger); color: #fff; font-size: 11px; line-height: 18px; text-align: center;
}
body.no-tabs .tabbar { display: none; }

/* ------------------------------------------------------------ building blocks */

.card {
  background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow);
  padding: 16px; margin-bottom: 14px;
}
.card.flush { padding: 0; overflow: hidden; }
.card h2, .section-title {
  font-size: 13px; font-weight: 700; letter-spacing: .6px; text-transform: uppercase; color: var(--text-3); margin: 0 0 10px;
}
.section-title { margin: 22px 4px 10px; display: flex; align-items: center; justify-content: space-between; }
.section-title .link { text-transform: none; letter-spacing: 0; font-size: 14px; }
.card.flush > h2 { padding: 14px 16px 0; }

.link { background: none; border: 0; padding: 6px 0; color: var(--brand-text); font-weight: 650; }

.row { display: flex; align-items: center; gap: 12px; }
.row.top { align-items: flex-start; }
.grow { flex: 1; min-width: 0; }
.right { text-align: right; }
.ellipsis { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stack > * + * { margin-top: 10px; }
.gap-8 { gap: 8px; }
.wrap { flex-wrap: wrap; }
.mt-8 { margin-top: 8px; } .mt-12 { margin-top: 12px; } .mt-16 { margin-top: 16px; } .mb-0 { margin-bottom: 0; }

.btn {
  min-height: var(--tap); padding: 0 16px; white-space: nowrap; border-radius: 24px; border: 1.5px solid transparent;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  font-weight: 650; font-size: 16px; background: var(--surface-2); color: var(--text); text-decoration: none;
}
.btn.primary { background: var(--brand); color: var(--brand-ink); }
:root[data-theme="dark"] .btn.primary { background: var(--brand-2); color: #062321; }
.btn.outline { background: transparent; border-color: var(--line); color: var(--brand-text); }
.btn.ok { background: var(--ok); color: #fff; }
:root[data-theme="dark"] .btn.ok { color: #062312; }
.btn.danger { background: var(--danger-soft); color: var(--danger); }
.btn.danger-solid { background: var(--danger); color: #fff; }
.btn.small { min-height: 38px; padding: 0 14px; font-size: 14px; border-radius: 19px; }
.btn.block { display: flex; width: 100%; }
.btn[disabled] { opacity: .45; pointer-events: none; }
.btn:active { filter: brightness(.94); }
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; }
.btn-row > .btn { flex: 1 1 140px; }

.chip {
  display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 9px; border-radius: 12px;
  font-size: 12px; font-weight: 700; white-space: nowrap; background: var(--surface-2); color: var(--text-2);
}
.chip.pending { background: var(--info-soft); color: var(--info); }
.chip.received { background: var(--ok-soft); color: var(--ok); }
.chip.overdue { background: var(--danger-soft); color: var(--danger); }
.chip.active { background: var(--brand-soft); color: var(--brand-text); }
.chip.closed { background: var(--surface-3); color: var(--text-2); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }

/* filter / choice chips */
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 8px; margin: 0 -2px 6px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.fchip {
  flex: none; height: 38px; padding: 0 14px; border-radius: 19px; border: 1.5px solid var(--line);
  background: var(--surface); color: var(--text-2); font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; gap: 6px;
}
.fchip.on { background: var(--brand-soft); border-color: var(--brand-2); color: var(--brand-text); }

.seg { display: flex; background: var(--surface-3); border-radius: 14px; padding: 4px; margin-bottom: 14px; }
.seg button {
  flex: 1; height: 42px; border: 0; border-radius: 10px; background: transparent; color: var(--text-2); font-weight: 650; font-size: 15px;
}
.seg button.on { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
.seg .count { font-weight: 600; color: var(--text-3); margin-left: 4px; }

/* ------------------------------------------------------------ lists */

.list { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; margin-bottom: 14px; }
.item {
  display: flex; align-items: center; gap: 12px; padding: 14px 16px; min-height: 64px; width: 100%;
  border: 0; background: none; text-align: left; border-top: 1px solid var(--line);
}
.list > .item:first-child, .list > .list-head + .item { border-top: 0; }
button.item:active, a.item:active { background: var(--surface-2); }
.item .t1 { font-weight: 650; font-size: 16px; }
.item .t2 { color: var(--text-2); font-size: 14px; margin-top: 1px; }
.item .t3 { color: var(--text-3); font-size: 13px; margin-top: 2px; }
.item .amt { font-weight: 700; font-size: 16px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.list-head { padding: 12px 16px 6px; font-size: 13px; font-weight: 700; color: var(--text-3); display: flex; justify-content: space-between; background: var(--surface-2); }
.list-foot { padding: 12px 16px; border-top: 1px solid var(--line); }

.datebox {
  width: 48px; height: 52px; border-radius: 12px; background: var(--surface-2); flex: none;
  display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.05;
}
.datebox .d { font-size: 19px; font-weight: 750; font-variant-numeric: tabular-nums; }
.datebox .m { font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--text-3); margin-top: 2px; }
.datebox.overdue { background: var(--danger-soft); color: var(--danger); }
.datebox.overdue .m { color: var(--danger); }
.datebox.today { background: var(--warn-soft); color: var(--warn); }
.datebox.today .m { color: var(--warn); }
.datebox.received { background: var(--ok-soft); color: var(--ok); }
.datebox.received .m { color: var(--ok); }

.avatar {
  width: 44px; height: 44px; border-radius: 50%; background: var(--brand-soft); color: var(--brand-text); flex: none;
  display: flex; align-items: center; justify-content: center; font-weight: 750; font-size: 17px;
}
.avatar.lg { width: 60px; height: 60px; font-size: 22px; }

.recv-btn {
  flex: none; height: 40px; padding: 0 12px; border-radius: 20px; border: 1.5px solid var(--ok);
  background: var(--surface); color: var(--ok); font-weight: 700; font-size: 14px; display: inline-flex; align-items: center; gap: 4px;
}
.recv-btn:active { background: var(--ok-soft); }

.more-btn { display: block; width: 100%; padding: 14px; border: 0; border-top: 1px solid var(--line); background: none; color: var(--brand-text); font-weight: 650; }

/* ------------------------------------------------------------ dashboard */

.hello { margin: 2px 4px 14px; }
.hello .h { font-size: 22px; font-weight: 750; }
.hello .s { color: var(--text-2); margin-top: 2px; }

.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
.stat {
  background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px;
  border: 0; text-align: left; display: block; width: 100%; min-height: 92px;
}
.stat .k { font-size: 13px; color: var(--text-2); font-weight: 600; display: flex; align-items: center; gap: 6px; }
.stat .v { font-size: 24px; font-weight: 780; margin-top: 6px; font-variant-numeric: tabular-nums; letter-spacing: -.3px; }
.stat .s { font-size: 13px; color: var(--text-3); margin-top: 2px; }
.stat.wide { grid-column: span 2; }
.stat.hero { background: var(--brand); color: var(--brand-ink); }
.stat.hero .k, .stat.hero .s { color: rgba(255, 255, 255, .82); }
.stat.alert .v { color: var(--danger); }
.stat .k svg { width: 18px; height: 18px; }

.attention { border-left: 4px solid var(--danger); }
.attention.soft { border-left-color: var(--warn); }
.att-line { display: flex; align-items: center; gap: 10px; padding: 8px 0; }
.att-line + .att-line { border-top: 1px solid var(--line); }
.att-icon { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex: none; }
.att-icon.red { background: var(--danger-soft); color: var(--danger); }
.att-icon.amber { background: var(--warn-soft); color: var(--warn); }
.att-icon.teal { background: var(--brand-soft); color: var(--brand-text); }

.freq-table { width: 100%; border-collapse: collapse; }
.freq-table td { padding: 10px 0; border-top: 1px solid var(--line); vertical-align: top; }
.freq-table tr:first-child td { border-top: 0; }
.freq-table td.r { text-align: right; font-variant-numeric: tabular-nums; font-weight: 650; white-space: nowrap; }
.freq-table tr.total td { font-weight: 750; font-size: 17px; border-top: 2px solid var(--line); }

.progress { height: 8px; border-radius: 4px; background: var(--surface-3); overflow: hidden; }
.progress > span { display: block; height: 100%; background: var(--ok); border-radius: 4px; }

.banner {
  display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: var(--radius); margin-bottom: 14px;
  background: var(--warn-soft); color: var(--text);
}
.banner.info { background: var(--info-soft); }
.banner.err { background: var(--danger-soft); }
.banner.ok { background: var(--ok-soft); }
.banner .bi { color: var(--warn); margin-top: 1px; }
.banner.info .bi { color: var(--info); }
.banner.err .bi { color: var(--danger); }
.banner.ok .bi { color: var(--ok); }
.banner .bt { font-weight: 700; }
.banner .bd { font-size: 14px; color: var(--text-2); margin-top: 2px; }
.banner .btn { margin-top: 10px; }

/* ------------------------------------------------------------ details */

.hero-card { background: var(--brand); color: var(--brand-ink); border-radius: var(--radius); padding: 18px; margin-bottom: 14px; box-shadow: var(--shadow); }
.hero-card .bank { font-size: 15px; opacity: .9; font-weight: 600; }
.hero-card .big { font-size: 32px; font-weight: 800; margin: 4px 0 2px; font-variant-numeric: tabular-nums; letter-spacing: -.5px; }
.hero-card .acct { display: inline-flex; align-items: center; gap: 6px; font-variant-numeric: tabular-nums; letter-spacing: .6px; font-weight: 650; }
.hero-card .acct button { color: inherit; background: rgba(255, 255, 255, .16); border: 0; border-radius: 16px; height: 32px; padding: 0 10px; display: inline-flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 650; }
.hero-card .meta { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; gap: 8px; }
.hero-card .who { background: rgba(255, 255, 255, .16); border: 0; color: inherit; border-radius: 18px; height: 36px; padding: 0 12px; font-weight: 650; display: inline-flex; align-items: center; gap: 6px; }
.hero-card .chip { background: rgba(255, 255, 255, .2); color: #fff; }
:root[data-theme="dark"] .hero-card, :root[data-theme="dark"] .stat.hero { background: linear-gradient(160deg, #11524f, #0d3b39); }

.kv { display: grid; grid-template-columns: auto 1fr; gap: 0; }
.kv > div { padding: 11px 0; border-top: 1px solid var(--line); }
.kv > div:nth-child(1), .kv > div:nth-child(2) { border-top: 0; }
.kv .k { color: var(--text-2); padding-right: 16px; font-size: 15px; }
.kv .v { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }

.next-card { display: flex; align-items: center; gap: 14px; }
.next-card .when { font-size: 20px; font-weight: 750; }

/* ------------------------------------------------------------ forms */

.field { margin-bottom: 16px; }
.field > label, .field > .lbl { display: block; font-weight: 650; font-size: 15px; margin-bottom: 6px; }
.field .opt { font-weight: 500; color: var(--text-3); font-size: 13px; }
.input, select.input, textarea.input {
  display: block; width: 100%; min-height: 50px; padding: 12px 14px; border-radius: 12px;
  border: 1.5px solid var(--line); background: var(--surface); color: var(--text); font-size: 17px; outline: none;
  -webkit-appearance: none; appearance: none;
}
select.input {
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='20' height='20' viewBox='0 0 24 24' fill='none' stroke='%236f7f7d' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");
  background-repeat: no-repeat; background-position: right 12px center; padding-right: 40px;
}
textarea.input { min-height: 84px; resize: vertical; }
.input:focus { border-color: var(--brand-2); box-shadow: 0 0 0 3px var(--brand-soft); }
.field.err .input { border-color: var(--danger); }
.field .hint { font-size: 13px; color: var(--text-3); margin-top: 6px; }
.field .error { font-size: 14px; color: var(--danger); margin-top: 6px; font-weight: 600; }
.input-wrap { position: relative; }
.input-wrap .prefix { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-3); font-size: 17px; pointer-events: none; }
.input-wrap .suffix { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); color: var(--text-3); font-size: 17px; pointer-events: none; }
.input-wrap.has-prefix .input { padding-left: 32px; }
.input-wrap.has-suffix .input { padding-right: 36px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.freq-pick { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.freq-pick button {
  min-height: 50px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); font-weight: 650; font-size: 15px; color: var(--text-2);
}
.freq-pick button.on { border-color: var(--brand-2); background: var(--brand-soft); color: var(--brand-text); }
.quick { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.quick button { height: 34px; padding: 0 12px; border-radius: 17px; border: 1px solid var(--line); background: var(--surface-2); font-size: 13px; font-weight: 650; color: var(--text-2); }
.preview-dates { font-size: 14px; color: var(--brand-text); background: var(--brand-soft); border-radius: 10px; padding: 10px 12px; margin-top: 8px; }

.radio-card {
  display: flex; gap: 12px; align-items: flex-start; padding: 14px; border-radius: 12px; border: 1.5px solid var(--line);
  background: var(--surface); margin-bottom: 8px; width: 100%; text-align: left;
}
.radio-card.on { border-color: var(--brand-2); background: var(--brand-soft); }
.radio-card .dot { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--text-3); flex: none; margin-top: 1px; position: relative; }
.radio-card.on .dot { border-color: var(--brand-2); }
.radio-card.on .dot::after { content: ""; position: absolute; inset: 4px; border-radius: 50%; background: var(--brand-2); }
.radio-card .rt { font-weight: 650; }
.radio-card .rd { font-size: 14px; color: var(--text-2); margin-top: 2px; }

.switch-row { display: flex; align-items: center; gap: 12px; padding: 12px 0; min-height: 56px; border-top: 1px solid var(--line); }
.switch-row:first-of-type { border-top: 0; }
.switch-row .sl { flex: 1; }
.switch-row .sd { font-size: 13px; color: var(--text-3); margin-top: 1px; }
.switch { position: relative; width: 52px; height: 32px; flex: none; }
.switch input { opacity: 0; width: 100%; height: 100%; position: absolute; margin: 0; cursor: pointer; z-index: 1; }
.switch .track { position: absolute; inset: 0; background: var(--surface-3); border-radius: 16px; transition: background .15s; border: 1.5px solid var(--line); }
.switch .track::after { content: ""; position: absolute; width: 24px; height: 24px; left: 3px; top: 2.5px; background: #fff; border-radius: 50%; box-shadow: 0 1px 3px rgba(0, 0, 0, .3); transition: transform .15s; }
.switch input:checked + .track { background: var(--brand-2); border-color: var(--brand-2); }
.switch input:checked + .track::after { transform: translateX(20px); }

.sticky-actions {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 15; padding: 12px 16px calc(12px + var(--safe-bottom));
  background: var(--surface); border-top: 1px solid var(--line); display: flex; justify-content: center;
}
.sticky-actions > div { width: 100%; max-width: 688px; display: flex; gap: 10px; }
.sticky-actions .btn { flex: 1; }

.fab {
  position: fixed; right: 18px; bottom: calc(var(--tabbar-h) + var(--safe-bottom) + 18px); z-index: 19;
  height: 56px; padding: 0 22px 0 18px; border-radius: 18px; border: 0; background: var(--brand); color: var(--brand-ink);
  box-shadow: var(--shadow-lg); display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 16px;
}
:root[data-theme="dark"] .fab { background: var(--brand-2); color: #062321; }
@media (min-width: 760px) { .fab { right: calc(50% - 344px); } }

.search-box { position: relative; margin-bottom: 12px; }
.search-box svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-3); }
.search-box .input { padding-left: 46px; border-radius: 26px; }
.search-box .clear { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); color: var(--text-3); }

.filters { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
.filters select.input { min-height: 44px; font-size: 15px; padding: 8px 36px 8px 12px; }
.filters .full { grid-column: span 2; }

.summary-line { display: flex; justify-content: space-between; align-items: baseline; margin: 0 4px 10px; color: var(--text-2); font-size: 14px; }
.summary-line b { color: var(--text); font-size: 16px; }

.empty { text-align: center; padding: 36px 20px; color: var(--text-2); }
.empty .ei { width: 64px; height: 64px; border-radius: 50%; background: var(--surface-2); margin: 0 auto 12px; display: flex; align-items: center; justify-content: center; color: var(--text-3); }
.empty .et { font-weight: 700; color: var(--text); font-size: 17px; margin-bottom: 4px; }
.empty .btn { margin-top: 16px; }

/* ------------------------------------------------------------ overlays */

.overlay { position: fixed; inset: 0; z-index: 50; display: flex; align-items: flex-end; justify-content: center; background: rgba(8, 20, 19, .45); animation: fade .15s ease-out; }
.overlay.center { align-items: center; padding: 20px; }
@keyframes fade { from { opacity: 0; } }
@keyframes rise { from { transform: translateY(40px); opacity: 0; } }
.sheet {
  width: 100%; max-width: 640px; max-height: 92vh; overflow-y: auto; background: var(--surface); color: var(--text);
  border-radius: 22px 22px 0 0; padding: 8px 18px calc(18px + var(--safe-bottom)); animation: rise .2s ease-out; box-shadow: var(--shadow-lg);
}
.sheet .grab { width: 40px; height: 4px; border-radius: 2px; background: var(--line); margin: 4px auto 12px; }
.sheet h3 { margin: 0 0 4px; font-size: 20px; }
.sheet .sub { color: var(--text-2); margin-bottom: 16px; font-size: 15px; }
.dialog { width: 100%; max-width: 420px; background: var(--surface); border-radius: 22px; padding: 22px 20px 16px; animation: rise .18s ease-out; box-shadow: var(--shadow-lg); }
.dialog h3 { margin: 0 0 8px; font-size: 19px; }
.dialog p { margin: 0 0 18px; color: var(--text-2); }
.dialog .btn-row { justify-content: flex-end; }
.dialog .btn-row .btn { flex: 0 1 auto; }

.toast-wrap { position: fixed; left: 0; right: 0; bottom: calc(var(--tabbar-h) + var(--safe-bottom) + 16px); z-index: 60; display: flex; justify-content: center; pointer-events: none; padding: 0 16px; }
body.no-tabs .toast-wrap { bottom: calc(var(--safe-bottom) + 96px); }
.toast { background: #1d2b2a; color: #fff; padding: 14px 18px; border-radius: 14px; box-shadow: var(--shadow-lg); max-width: 560px; font-size: 15px; animation: rise .2s ease-out; pointer-events: auto; display: flex; gap: 12px; align-items: center; }
.toast button { background: none; border: 0; color: #7fe0d4; font-weight: 700; padding: 4px; }

.warn-list { max-height: 220px; overflow-y: auto; background: var(--surface-2); border-radius: 12px; padding: 10px 12px; font-size: 14px; color: var(--text-2); margin: 8px 0 14px; }
.warn-list div + div { margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--line); }
.count-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px 0; }
.count-grid div { background: var(--surface-2); border-radius: 12px; padding: 12px 8px; text-align: center; }
.count-grid b { display: block; font-size: 22px; }
.count-grid span { font-size: 12px; color: var(--text-2); }

/* ------------------------------------------------------------ lock + keypad */

.lock {
  position: fixed; inset: 0; z-index: 100; background: var(--brand); color: #fff; display: flex; flex-direction: column;
  align-items: center; justify-content: center; padding: calc(24px + var(--safe-top)) 24px calc(24px + var(--safe-bottom));
}
.lock .logo { width: 72px; height: 72px; margin-bottom: 14px; }
.lock .lt { font-size: 22px; font-weight: 700; }
.lock .ls { opacity: .85; margin-top: 4px; min-height: 22px; text-align: center; }
.dots { display: flex; gap: 14px; margin: 26px 0 30px; height: 18px; }
.dots span { width: 16px; height: 16px; border-radius: 50%; border: 2px solid currentColor; opacity: .9; }
.dots span.on { background: currentColor; }
.dots.shake { animation: shake .35s; }
@keyframes shake { 20%, 60% { transform: translateX(-10px); } 40%, 80% { transform: translateX(10px); } }
.keypad { display: grid; grid-template-columns: repeat(3, 76px); gap: 14px 22px; }
.keypad button {
  width: 76px; height: 76px; border-radius: 50%; border: 0; background: rgba(255, 255, 255, .14); color: inherit; font-size: 28px; font-weight: 600;
  display: flex; align-items: center; justify-content: center;
}
.keypad button:active { background: rgba(255, 255, 255, .3); }
.keypad button.ghost { background: transparent; }
.keypad button.ghost:active { background: rgba(255, 255, 255, .14); }
.sheet .keypad button { background: var(--surface-2); color: var(--text); }
.sheet .dots { color: var(--brand-text); justify-content: center; }
.sheet .keypad { margin: 0 auto; }

/* ------------------------------------------------------------ onboarding */

.welcome { max-width: 520px; margin: 0 auto; padding-top: 8px; }
.welcome .logo { width: 76px; height: 76px; display: block; margin: 8px auto 12px; }
.welcome h2 { text-align: center; font-size: 26px; margin: 0; }
.welcome .lead { text-align: center; color: var(--text-2); margin: 8px 8px 22px; }
.choice {
  display: flex; gap: 14px; align-items: center; width: 100%; text-align: left; padding: 18px 16px; border-radius: var(--radius);
  border: 1.5px solid var(--line); background: var(--surface); margin-bottom: 12px; box-shadow: var(--shadow);
}
.choice.primary { border-color: var(--brand-2); }
.choice .ci { width: 48px; height: 48px; border-radius: 14px; background: var(--brand-soft); color: var(--brand-text); display: flex; align-items: center; justify-content: center; flex: none; }
.choice .ct { font-weight: 700; font-size: 17px; }
.choice .cd { color: var(--text-2); font-size: 14px; margin-top: 2px; }
.steps { counter-reset: s; padding: 0; margin: 0; list-style: none; }
.steps li { counter-increment: s; position: relative; padding: 0 0 12px 38px; color: var(--text-2); font-size: 15px; }
.steps li::before { content: counter(s); position: absolute; left: 0; top: -1px; width: 26px; height: 26px; border-radius: 50%; background: var(--brand-soft); color: var(--brand-text); font-weight: 750; font-size: 14px; display: flex; align-items: center; justify-content: center; }

@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
@media (min-width: 560px) { .stats { grid-template-columns: repeat(3, 1fr); } .stat.wide { grid-column: span 3; } }
.logo svg, .avatar svg { width: 100%; height: 100%; display: block; }
.avatar:has(svg) { background: none; }
.welcome .card h2 { font-size: 13px; text-align: left; margin: 0 0 12px; }

.sheet .sheet-actions {
  position: sticky; bottom: calc(-18px - var(--safe-bottom)); z-index: 2;
  margin: 14px -18px calc(-18px - var(--safe-bottom)); padding: 12px 18px calc(18px + var(--safe-bottom));
  background: var(--surface); border-top: 1px solid var(--line);
}
.lock .logo svg { border-radius: 20px; box-shadow: 0 0 0 2px rgba(255, 255, 255, .28); }
.btn-row > .btn { padding: 0 12px; }

</style>
</head>

  <header class="appbar"><div id="bar" class="appbar-row"></div></header>
  <main id="main" tabindex="-1"></main>
  <div id="extra"></div>
  <nav class="tabbar" aria-label="Main"><div id="tabs" class="tabbar-inner"></div></nav>
</div>
<div id="toast" class="toast-wrap" aria-live="polite"></div>

<script>
/* Deposit Manager — core utilities: dates, numbers, formatting, DOM helpers. */
(function (DM) {
  'use strict';

  var MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  var MONTHS_LONG = ['january', 'february', 'march', 'april', 'may', 'june', 'july', 'august',
    'september', 'october', 'november', 'december'];

  /* ------------------------------------------------------------------ dates
   * Dates are stored everywhere as plain 'YYYY-MM-DD' strings. No time zones,
   * no Date objects in the data — that keeps due dates stable on every phone. */

  function pad(n, w) {
    var s = String(n);
    while (s.length < (w || 2)) s = '0' + s;
    return s;
  }

  function iso(y, m, d) {
    return pad(y, 4) + '-' + pad(m) + '-' + pad(d);
  }

  function daysInMonth(y, m) {
    return new Date(Date.UTC(y, m, 0)).getUTCDate();
  }

  function parseISO(s) {
    if (typeof s !== 'string') return null;
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s);
    if (!m) return null;
    var y = +m[1], mo = +m[2], d = +m[3];
    if (mo < 1 || mo > 12 || d < 1 || d > daysInMonth(y, mo)) return null;
    return { y: y, m: mo, d: d };
  }

  function isValidISO(s) {
    return parseISO(s) !== null;
  }

  function todayISO() {
    var n = new Date();
    return iso(n.getFullYear(), n.getMonth() + 1, n.getDate());
  }

  function toUTC(s) {
    var p = parseISO(s);
    return p ? Date.UTC(p.y, p.m - 1, p.d) : NaN;
  }

  function fromUTC(ms) {
    var d = new Date(ms);
    return iso(d.getUTCFullYear(), d.getUTCMonth() + 1, d.getUTCDate());
  }

  function addDays(s, n) {
    return fromUTC(toUTC(s) + n * 86400000);
  }

  /** Whole days from a to b (b - a). */
  function diffDays(a, b) {
    return Math.round((toUTC(b) - toUTC(a)) / 86400000);
  }

  /**
   * Add months keeping the day-of-month anchored. 31 Jan + 1 month = 28/29 Feb,
   * and + 2 months = 31 Mar again (never drifts), because each date is computed
   * from the original anchor date rather than from the previous result.
   */
  function addMonths(s, n, anchorDay) {
    var p = parseISO(s);
    if (!p) return '';
    var total = (p.y * 12 + (p.m - 1)) + n;
    var y = Math.floor(total / 12), m = total - y * 12 + 1;
    var day = Math.min(anchorDay || p.d, daysInMonth(y, m));
    return iso(y, m, day);
  }

  function fmtDate(s) {
    var p = parseISO(s);
    if (!p) return '—';
    return p.d + ' ' + MONTHS[p.m - 1] + ' ' + p.y;
  }

  function fmtDateShort(s) {
    var p = parseISO(s);
    if (!p) return '—';
    return p.d + ' ' + MONTHS[p.m - 1];
  }

  function fmtMonthYear(s) {
    var p = parseISO(s);
    if (!p) return '—';
    return MONTHS_LONG[p.m - 1].charAt(0).toUpperCase() + MONTHS_LONG[p.m - 1].slice(1) + ' ' + p.y;
  }

  function weekday(s) {
    var t = toUTC(s);
    if (isNaN(t)) return '';
    return ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'][new Date(t).getUTCDay()];
  }

  /** "in 3 days", "today", "2 days ago" relative to `today`. */
  function relDays(s, today) {
    var n = diffDays(today || todayISO(), s);
    if (isNaN(n)) return '';
    if (n === 0) return 'today';
    if (n === 1) return 'tomorrow';
    if (n === -1) return 'yesterday';
    if (n > 0) return 'in ' + n + ' days';
    return (-n) + ' days ago';
  }

  /** Friendly distance for far dates: "in 5 months", "in 4 years 3 months", "2 years ago". */
  function relLong(s, today) {
    today = today || todayISO();
    var n = diffDays(today, s);
    if (isNaN(n)) return '';
    if (Math.abs(n) <= 60) return relDays(s, today);
    var a = parseISO(n > 0 ? today : s), b = parseISO(n > 0 ? s : today);

    var y = Math.floor(months / 12), m = months % 12, parts = [];
    if (y) parts.push(y + (y === 1 ? ' year' : ' years'));
    if (m) parts.push(m + (m === 1 ? ' month' : ' months'));

    return n > 0 ? 'in ' + txt : txt + ' ago';

  function twoDigitYear(y) {
    if (y >= 100) return y;
    return y < 70 ? 2000 + y : 1900 + y;
  }

  function monthFromName(name) {
    var k = String(name).toLowerCase().replace(/\.$/, '');
    for (var i = 0; i < 12; i++) {
      if (MONTHS_LONG[i] === k || MONTHS_LONG[i].slice(0, 3) === k || (k === 'sept' && i === 8)) return i + 1;

    return 0;

  function checked(y, m, d) {
    if (!(y >= 1900 && y <= 2200) || !(m >= 1 && m <= 12) || !(d >= 1 && d <= daysInMonth(y, m))) return null;

  /**
   * Parse the date formats people actually type into Excel in India.
   * Numeric day/month order is assumed to be DD/MM/YYYY (Indian convention);
   * YYYY-MM-DD is always year-first. Returns 'YYYY-MM-DD' or null.
   */
  function parseFlexibleDate(v) {
    if (v === null || v === undefined || v === '') return null;
    if (v instanceof Date && !isNaN(v)) return iso(v.getFullYear(), v.getMonth() + 1, v.getDate());
    var s = String(v).trim().replace(/\s+/g, ' ');
    if (!s) return null;
    var m;

    if ((m = /^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})(?:[ T].*)?$/.exec(s))) return checked(+m[1], +m[2], +m[3]);

    if ((m = /^(\d{1,2})(?:st|nd|rd|th)?[-/ .,]*([A-Za-z]{3,9})\.?[-/ .,]*(\d{2}|\d{4})$/.exec(s))) {

      var mo2 = monthFromName(m[1]);
      return mo2 ? checked(twoDigitYear(+m[3]), mo2, +m[2]) : null;
    }
    return null;
  }

  /* ---------------------------------------------------------------- numbers */

  function round2(n) {
    return Math.round((+n + Number.EPSILON) * 100) / 100;
  }

  /** Parse "1,00,000", "₹ 5,250.50", "7.5%", "Rs. 500". Returns NaN when not a number. */
  function toNumber(v) {
    if (typeof v === 'number') return isFinite(v) ? v : NaN;
    if (v === null || v === undefined) return NaN;
    var s = String(v).trim();
    if (!s) return NaN;
    s = s.replace(/₹|rs\.?|inr|%|,|\s/gi, '');
    if (!/^[-+]?(\d+\.?\d*|\.\d+)(e[-+]?\d+)?$/i.test(s)) return NaN;
    return parseFloat(s);
  }

  var inrWhole = new Intl.NumberFormat('en-IN', { maximumFractionDigits: 0 });
  var inrFrac = new Intl.NumberFormat('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

  function fmtMoney(n) {
    n = +n;
    if (!isFinite(n)) return '—';
    var neg = n < 0;
    n = Math.abs(round2(n));
    var s = (n % 1 === 0) ? inrWhole.format(n) : inrFrac.format(n);
    return (neg ? '−₹' : '₹') + s;
  }

  /** Compact Indian units for small stat tiles: ₹12.5 L, ₹1.2 Cr. */
  function fmtMoneyShort(n) {
    n = +n || 0;
    var a = Math.abs(n);
    if (a >= 1e7) return '₹' + trimZero((n / 1e7).toFixed(2)) + ' Cr';
    if (a >= 1e5) return '₹' + trimZero((n / 1e5).toFixed(2)) + ' L';
    return fmtMoney(n);
  }

  function trimZero(s) {
    return s.replace(/\.?0+$/, '');
  }

  function fmtRate(r) {
    r = +r;
    if (!isFinite(r) || r === 0) return '—';
    return trimZero(round2(r).toFixed(2)) + '%';
  }

  function plural(n, one, many) {
    return n + ' ' + (n === 1 ? one : (many || one + 's'));
  }

  /* ---------------------------------------------------------------- privacy */

  function maskAccount(acc) {
    var s = String(acc || '').replace(/\s+/g, '');
    if (!s) return '—';
    var last = s.slice(-4);
    return 'XXXX' + (s.length > 4 ? last : '');
  }

  /* ------------------------------------------------------------------ misc */

  function normKey(s) {
    return String(s === null || s === undefined ? '' : s).toLowerCase().replace(/[^a-z0-9]/g, '');
  }

  function nextId(prefix, ids, width) {

    var t = null;

    return JSON.parse(JSON.stringify(o));
  }

  function str(v) {
    return v === null || v === undefined ? '' : String(v).trim();
  }

  /** Small, fast content fingerprint (FNV-1a) for detecting outside edits to the Excel file. */
  function fingerprint(bytes) {

  function bytesToBase64(bytes) {

    dep.status = 'Active';
    dep.closedDate = '';
    invalidate(data);
    return syncSchedule(data, { ids: [id], today: today });
  }

  function canDeleteDeposit(data, id) {
    return !paymentsOf(data, id).some(function (p) { return p.status === 'Received'; });
  }

  function deleteDeposit(data, id) {
    if (!canDeleteDeposit(data, id)) throw new Error('This deposit already has received payments, so it is kept for your records. Close it instead.');
    data.deposits = data.deposits.filter(function (d) { return d.id !== id; });
    data.payments = data.payments.filter(function (p) { return p.depositId !== id; });
    invalidate(data);
  }

  function markReceived(data, pid, f, today) {
    var p = payment(data, pid);
    if (!p) throw new Error('Payment not found');
    var amt = num(f.amount);
    p.status = 'Received';
    p.receivedAmount = amt === '' ? p.expectedAmount : amt;
    p.receivedDate = U.isValidISO(f.date) ? f.date : (today || U.todayISO());
    if (f.notes !== undefined) p.notes = U.str(f.notes);
    invalidate(data);
    syncSchedule(data, { ids: [p.depositId], today: today });
    return nextPayment(data, p.depositId, today || U.todayISO());
  }

  function markNotReceived(data, pid, today) {
    var p = payment(data, pid);
    if (!p) throw new Error('Payment not found');
    p.status = 'Pending';
    p.receivedAmount = '';
    p.receivedDate = '';
    if (p.notes === PAST_NOTE) p.notes = '';
    invalidate(data);
    syncSchedule(data, { ids: [p.depositId], today: today });
  }

  function updatePayment(data, pid, f) {
    var p = payment(data, pid);
    if (!p) throw new Error('Payment not found');
    if (f.expectedAmount !== undefined) { var e = num(f.expectedAmount); if (e !== '') p.expectedAmount = e; }
    if (f.notes !== undefined) p.notes = U.str(f.notes);
    if (p.status === 'Received') {
      if (f.receivedAmount !== undefined) { var r = num(f.receivedAmount); if (r !== '') p.receivedAmount = r; }
      if (f.receivedDate !== undefined && U.isValidISO(f.receivedDate)) p.receivedDate = f.receivedDate;
    }
    invalidate(data);
  }

  /* ------------------------------------------------------------ reminders */

  function daysLabel(d, what) {
    if (d === 0) return what + ' today';
    if (d === 1) return what + ' tomorrow';
    return what + ' in ' + d + ' days';
  }

  /**
   * Reminder list (the Notifications sheet, and what the phone schedules):
   * payments 7/3/1/0 days before and maturity 30/7/1/0 days before, from today through `horizonDays`.
   */
  function buildReminders(data, prefs, today, horizonDays) {
    var n = (prefs && prefs.notify) || DEFAULT_PREFS.notify;
    horizonDays = horizonDays || 60;
    var until = U.addDays(today, horizonDays), out = [];
    var pDays = (n.paymentDays || []).slice().sort(function (a, b) { return b - a; });
    var mDays = (n.maturityDays || []).slice().sort(function (a, b) { return b - a; });
    var maxP = pDays.length ? pDays[0] : 0, lastDue = U.addDays(until, maxP);
    data.payments.forEach(function (p) {
      if (p.status === 'Received' || p.dueDate < today || p.dueDate > lastDue) return;
      var dep = deposit(data, p.depositId);
      if (!dep || dep.status !== 'Active') return;
      pDays.forEach(function (d) {
        var on = U.addDays(p.dueDate, -d);
        if (on < today || on > until) return;
        out.push({
          type: 'Payment', notifyOn: on, daysBefore: d, eventDate: p.dueDate, depositId: dep.id, paymentId: p.id,
          memberName: memberName(data, dep.memberId),
          title: daysLabel(d, 'Payment due'),
          message: memberName(data, dep.memberId) + ' · ' + dep.bank + ' ' + U.maskAccount(dep.accountNumber) +
            ' · ' + U.fmtMoney(p.expectedAmount) + ' on ' + U.fmtDate(p.dueDate)
        });
      });
    });
    data.deposits.forEach(function (dep) {
      if (dep.status !== 'Active' || !U.isValidISO(dep.maturityDate) || dep.maturityDate < today) return;
      mDays.forEach(function (d) {
        var on = U.addDays(dep.maturityDate, -d);
        if (on < today || on > until) return;
        out.push({
          type: 'Maturity', notifyOn: on, daysBefore: d, eventDate: dep.maturityDate, depositId: dep.id, paymentId: '',
          memberName: memberName(data, dep.memberId),
          title: daysLabel(d, 'Deposit matures'),
          message: memberName(data, dep.memberId) + ' · ' + dep.bank + ' ' + U.maskAccount(dep.accountNumber) +
            ' · ' + U.fmtMoney(dep.depositAmount) + ' on ' + U.fmtDate(dep.maturityDate)
        });
      });
    });
    out.sort(function (a, b) {
      return a.notifyOn < b.notifyOn ? -1 : a.notifyOn > b.notifyOn ? 1 :
        a.eventDate < b.eventDate ? -1 : a.eventDate > b.eventDate ? 1 : (a.depositId < b.depositId ? -1 : 1);
    });
    out.forEach(function (r, i) {
      r.id = 'N' + U.pad(i + 1, 4);
      r.status = r.notifyOn === today ? 'Today' : 'Scheduled';
    });
    return out;
  }

  /* ------------------------------------------------------------ statistics */

  function computeStats(data, today) {
    var st = {
      members: data.members.length, active: 0, closed: 0, principal: 0,
      upcoming30: { count: 0, amount: 0 }, pending: 0, overdue: { count: 0, amount: 0 },
      byFrequency: FREQS.map(function (f) { return { frequency: f, count: 0, perPayout: 0, yearly: 0 }; }),
      yearlyIncome: 0, thisMonth: { expected: 0, received: 0 }, maturing: [], matured: [], incomplete: []
    };
    var in30 = U.addDays(today, 30), monthKey = today.slice(0, 7), in60 = U.addDays(today, 60);
    var active = {};
    data.deposits.forEach(function (d) {
      if (d.status === 'Closed') { st.closed++; return; }
      st.active++;
      active[d.id] = d;
      st.principal += +d.depositAmount || 0;
      var fi = FREQS.indexOf(d.frequency);
      if (fi >= 0) {
        var b = st.byFrequency[fi], amt = +d.paymentAmount || 0;
        b.count++;
        b.perPayout += amt;
        b.yearly += amt * 12 / FREQ_MONTHS[d.frequency];
      }
      if (!hasSchedule(d)) st.incomplete.push(d);
      if (U.isValidISO(d.maturityDate)) {
        if (d.maturityDate < today) st.matured.push(d);
        else if (d.maturityDate <= in60) st.maturing.push(d);
      }
    });
    data.payments.forEach(function (p) {
      if (p.status === 'Received') {
        if ((p.receivedDate || '').slice(0, 7) === monthKey) st.thisMonth.received += +p.receivedAmount || 0;
        return;
      }
      if (p.dueDate.slice(0, 7) === monthKey && active[p.depositId]) st.thisMonth.expected += +p.expectedAmount || 0;
      if (p.dueDate < today) {
        st.overdue.count++;
        st.overdue.amount += +p.expectedAmount || 0;
      } else if (active[p.depositId]) {
        st.pending++;
        if (p.dueDate <= in30) { st.upcoming30.count++; st.upcoming30.amount += +p.expectedAmount || 0; }
      }
    });
    st.byFrequency.forEach(function (b) {
      b.perPayout = U.round2(b.perPayout);
      b.yearly = U.round2(b.yearly);
      st.yearlyIncome += b.yearly;
    });
    st.yearlyIncome = U.round2(st.yearlyIncome);
    st.principal = U.round2(st.principal);
    st.overdue.amount = U.round2(st.overdue.amount);
    st.upcoming30.amount = U.round2(st.upcoming30.amount);
    st.thisMonth.expected = U.round2(st.thisMonth.expected);
    st.thisMonth.received = U.round2(st.thisMonth.received);
    st.maturing.sort(function (a, b) { return a.maturityDate < b.maturityDate ? -1 : 1; });
    st.matured.sort(function (a, b) { return a.maturityDate < b.maturityDate ? -1 : 1; });
    return st;
  }

  /** Unreceived payments (optionally only for active deposits) sorted by due date. */
  function openPayments(data, opts) {
    opts = opts || {};
    return data.payments.filter(function (p) {
      if (p.status === 'Received') return false;
      if (opts.from && p.dueDate < opts.from) return false;
      if (opts.to && p.dueDate > opts.to) return false;
      if (opts.before && p.dueDate >= opts.before) return false;
      var d = deposit(data, p.depositId);
      if (!d) return false;

  /* ------------------------------------------------------------ search */

  function searchDeposits(data, f) {
    f = f || {};
    var q = U.str(f.q).toLowerCase(), qDigits = q.replace(/\D/g, '');
    var list = data.deposits.filter(function (d) {
      if (f.status && f.status !== 'All' && d.status !== f.status) return false;
      if (f.frequency && d.frequency !== f.frequency) return false;
      if (f.memberId && d.memberId !== f.memberId) return false;
      if (f.village && U.normKey(d.village) !== U.normKey(f.village)) return false;
      if (f.bank && U.normKey(d.bank) !== U.normKey(f.bank)) return false;
      if (!q) return true;
      var m = member(data, d.memberId);
      var hay = [d.id, d.bank, d.village, d.notes, m ? m.name : '', m ? m.village : '', d.frequency].join(' ').toLowerCase();
      if (hay.indexOf(q) >= 0) return true;
      if (qDigits.length >= 3 && qDigits === q.replace(/\s/g, '') && String(d.accountNumber).indexOf(qDigits) >= 0) return true;
      return false;
    });
    var sort = f.sort || 'member';
    list.sort(function (a, b) {
      var r = 0;
      if (sort === 'amount') r = (+b.depositAmount || 0) - (+a.depositAmount || 0);
      else if (sort === 'maturity') r = (a.maturityDate || '9999') < (b.maturityDate || '9999') ? -1 : (a.maturityDate || '9999') > (b.maturityDate || '9999') ? 1 : 0;
      else if (sort === 'bank') r = a.bank.localeCompare(b.bank);
      else if (sort === 'newest') r = (b.startDate || '') < (a.startDate || '') ? -1 : (b.startDate || '') > (a.startDate || '') ? 1 : 0;
      else r = memberName(data, a.memberId).localeCompare(memberName(data, b.memberId));
      return r || (a.id < b.id ? -1 : 1);
    });
    return list;
  }

  function distinct(values) {
    var seen = {}, out = [];
    values.forEach(function (v) {

      P.device.authenticate('Unlock Deposit Manager').then(function (ok) { if (ok) unlock(); });
    }
    var bioKey = canUseBiometric() ? h('button', { class: 'ghost', onclick: tryBio, 'aria-label': 'Use fingerprint' }, UI.icon('finger', 'lg')) : null;
    pad = UI.pinPad({
      length: App.prefs.lock.length, message: '',
      extraKey: bioKey,
      isBlocked: function () {
        var s = blockedFor();
        if (s) pad.setMessage('Too many wrong tries. Wait ' + s + ' seconds.');
        return s > 0;
      },
      onDone: function (pin) {
        App.checkPin(pin).then(function (ok) {
          if (ok) { registerSuccess(); unlock(); return; }
          registerFailure();
          pad.shake();
          var s = blockedFor();
          pad.reset(s ? 'Too many wrong tries. Wait ' + s + ' seconds.' : 'Wrong PIN, try again');
        });
      }
    });
    lockEl = h('div', { class: 'lock', role: 'dialog', 'aria-label': 'App locked' },
      UI.logo('logo'), h('div', { class: 'lt' }, 'Deposit Manager'), h('div', { class: 'ls' }, 'Enter your PIN'), pad.el);
    lockEl._pad = pad;
    document.body.appendChild(lockEl);
    if (canUseBiometric()) setTimeout(tryBio, 350);
  };

  function unlock() {
    if (!lockEl) return;
    if (lockEl._pad) lockEl._pad.destroy();
    lockEl.remove();
    lockEl = null;
    document.body.classList.remove('locked');
    App.afterUnlock();
  }

  App.afterUnlock = function () {
    var target = P.device.launchTarget();
    if (target && M.deposit(App.data, target)) App.nav.go('deposit/' + target);
    App.checkExternalChanges();
  };

  /** Ask for PIN (or fingerprint) before showing something sensitive. Resolves true when allowed. */
  App.verifyUser = function (reason) {
    if (!App.prefs.lock.enabled) return Promise.resolve(true);
    var first = canUseBiometric() ? P.device.authenticate(reason || 'Confirm it is you') : Promise.resolve(false);
    return first.then(function (ok) {
      if (ok) return true;
      return UI.sheet(function (close) {
        var pad = UI.pinPad({
          length: App.prefs.lock.length, message: reason || 'Enter your PIN',
          isBlocked: function () { var s = blockedFor(); if (s) pad.setMessage('Too many wrong tries. Wait ' + s + ' seconds.'); return s > 0; },
          onDone: function (pin) {
            App.checkPin(pin).then(function (good) {
              if (good) { registerSuccess(); pad.destroy(); close(true); return; }
              registerFailure();
              pad.shake();
              pad.reset('Wrong PIN, try again');
            });
          }
        });
        return [h('h3', { style: 'text-align:center' }, 'Confirm it is you'), h('div', { class: 'mt-12' }, pad.el)];
      }).then(function (v) { return v === true; });
    });
  };

  /* ------------------------------------------------------------ theme */

  var mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
  App.applyTheme = function () {
    var t = App.prefs.theme, dark = t === 'dark' || (t === 'system' && mq && mq.matches);
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    P.device.setThemeColors(dark ? '#0F4E4C' : '#0F5C5A', dark ? '#141E1D' : '#FFFFFF', !dark);
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', dark ? '#0F4E4C' : '#0F5C5A');
  };
  if (mq && mq.addEventListener) mq.addEventListener('change', function () { App.applyTheme(); });

  /* ------------------------------------------------------------ navigation */

  var TABS = ['home', 'deposits', 'payments', 'members', 'settings'];

  function parse(path) {
    var q = {}, parts = String(path || 'home').split('?');
    if (parts[1]) parts[1].split('&').forEach(function (kv) {
      var p = kv.split('=');
      q[decodeURIComponent(p[0])] = decodeURIComponent(p[1] || '');
    });
    var seg = parts[0].split('/');
    return { path: path, name: seg[0] || 'home', arg: seg[1] ? decodeURIComponent(seg[1]) : '', query: q };
  }

  var nav = {
    stack: [{ path: 'home', scroll: 0 }],
    current: function () { return parse(nav.stack[nav.stack.length - 1].path); },
    tabName: function () {
      var n = parse(nav.stack[0].path).name;
      return TABS.indexOf(n) >= 0 ? n : 'home';
    },
    go: function (path) {
      nav.stack[nav.stack.length - 1].scroll = window.scrollY;
      nav.stack.push({ path: path, scroll: 0 });
      App.render(0);
    },
    replace: function (path) {
      nav.stack[nav.stack.length - 1] = { path: path, scroll: window.scrollY };
      App.render(window.scrollY);
    },
    tab: function (path) {
      nav.stack = [{ path: path, scroll: 0 }];
      App.render(0);
    },
    back: function () {
      if (UI.closeTop()) return true;
      if (nav.stack.length > 1) {
        nav.stack.pop();
        App.render(nav.stack[nav.stack.length - 1].scroll || 0);
        return true;
      }
      if (nav.current().name !== 'home' && App.prefs.onboarded) { nav.tab('home'); return true; }
      return false;
    }
  };
  App.nav = nav;

  /* ------------------------------------------------------------ rendering */

  var els = {};

  App.render = function (scrollTo) {
    if (!els.main) return;
    var route = nav.current();
    if (!App.prefs.onboarded && !hasData() && route.name !== 'welcome') {
      nav.stack = [{ path: 'welcome', scroll: 0 }];
      route = nav.current();
    }
    var screen = DM.screens[route.name] || DM.screens.home;
    var view;
    try {
      view = screen(route);
    } catch (e) {
      console.error(e);
      view = { title: 'Something went wrong', body: UI.empty('alert', 'Something went wrong', String(e && e.message || e),
        h('button', { class: 'btn primary', onclick: function () { nav.tab('home'); } }, 'Go to Home')) };
    }
    var back = nav.stack.length > 1 || view.back;
    U.clear(els.bar);
    els.bar.className = 'appbar-row' + (back ? ' has-back' : '');
    if (back) els.bar.appendChild(h('button', { class: 'icon-btn', 'aria-label': 'Back', onclick: function () { if (!nav.back()) nav.tab('home'); } }, UI.icon('back')));
    els.bar.appendChild(h('h1', null, view.title || 'Deposit Manager'));
    U.append(els.bar, view.actions || null);
    if (view.showStatus !== false) {
      els.pill = h('button', { class: 'save-pill', onclick: function () { nav.tab('settings'); } });
      els.bar.appendChild(els.pill);
      App.renderStatus();
    } else els.pill = null;

    U.clear(els.main);
    U.append(els.main, view.body);
    U.clear(els.extra);
    U.append(els.extra, view.fab || null);
    U.append(els.extra, view.sticky || null);

    var tabs = view.tabs !== false && App.prefs.onboarded !== false;
    document.body.classList.toggle('no-tabs', !tabs);
    renderTabs();
    document.title = (view.title ? view.title + ' · ' : '') + 'Deposit Manager';
    try { history.replaceState(null, '', '#/' + nav.stack[nav.stack.length - 1].path); } catch (e) { /* file:// quirks */ }
    if (scrollTo !== undefined) window.scrollTo(0, scrollTo || 0);
    if (view.after) setTimeout(view.after, 0);
  };

  App.renderStatus = function () {
    if (!els.pill) return;
    var s = App.saveStatus();
    U.clear(els.pill);
    els.pill.className = 'save-pill ' + s.kind;
    els.pill.title = s.detail;
    els.pill.setAttribute('aria-label', s.detail);
    els.pill.appendChild(h('span', { class: 'dot' }));
    els.pill.appendChild(document.createTextNode(s.label));
  };

  function renderTabs() {
    var defs = [
      { name: 'home', label: 'Home', icon: 'home' },
      { name: 'deposits', label: 'Deposits', icon: 'bank' },
      { name: 'payments', label: 'Payments', icon: 'calendar' },
      { name: 'members', label: 'Family', icon: 'users' },
      { name: 'settings', label: 'Settings', icon: 'sliders' }
    ];
    var cur = nav.tabName(), overdue = 0;
    App.data.payments.forEach(function (p) { if (p.status === 'Overdue') overdue++; });
    U.clear(els.tabs);
    defs.forEach(function (d) {
      els.tabs.appendChild(h('button', {
        class: 'tab' + (d.name === cur ? ' on' : ''), 'aria-current': d.name === cur ? 'page' : null,
        onclick: function () { nav.tab(d.name); }
      }, h('span', { class: 'pill' }, UI.icon(d.icon)), d.label,
      d.name === 'payments' && overdue ? h('span', { class: 'badge' }, overdue > 99 ? '99+' : String(overdue)) : null));
    });
  }

  /* ------------------------------------------------------------ app lifecycle */

  function onResume() {
    var now = U.todayISO();
    if (now !== App.today) {
      App.today = now;
      M.rollForward(App.data, App.today);
      App.commit();
    }
    if (App.prefs.lock.enabled && hiddenAt && Date.now() - hiddenAt >= (App.prefs.lock.after || 0) * 1000) App.lockNow();
    hiddenAt = 0;
    if (!isLocked()) {
      var target = P.device.launchTarget();
      if (target && M.deposit(App.data, target)) App.nav.go('deposit/' + target);
      App.checkExternalChanges();
    }
  }

  function start() {
    els.bar = document.getElementById('bar');
    els.main = document.getElementById('main');
    els.tabs = document.getElementById('tabs');
    els.extra = document.getElementById('extra');

    loadAll();
    App.applyTheme();
    P.device.setSecure(App.prefs.secureScreen);
    // keep schedules rolling forward and statuses current for today's date
    M.rollForward(App.data, App.today);
    if (hasData()) persistData();

    var hash = (location.hash || '').replace(/^#\/?/, '');
    if (hash && App.prefs.onboarded) {
      var r = parse(hash);
      if (DM.screens[r.name] && r.name !== 'welcome') nav.stack = TABS.indexOf(r.name) >= 0 ? [{ path: hash }] : [{ path: 'home' }, { path: hash }];
    }

    P.on('back', function () {
      if (isLocked()) { P.device.exit(); return true; }
      return nav.back();
    });
    P.on('pause', function () { hiddenAt = Date.now(); if (queueExcelWrite.pending()) queueExcelWrite.flush(); });
    P.on('resume', onResume);
    window.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') UI.closeTop();
    });
    setInterval(function () {
      if (U.todayISO() !== App.today && document.visibilityState === 'visible') onResume();
    }, 60000);

    P.excel.init().then(function () {
      App.render(0);
      queueReminders();
      if (App.prefs.lock.enabled) App.lockNow();
      else App.afterUnlock();
      if (P.kind === 'fs' && App.linkedFile()) {
        P.excel.needsPermission().then(function (need) { if (need) setSave('permission'); });
      }
    });
  }

  App.start = start;
  DM.app = App;
})(window.DM = window.DM || {});

</script>
<script>
/* Deposit Manager — screens and sheets. Each screen returns {title, body, actions?, fab?, sticky?, tabs?, after?}. */
(function (DM) {
  'use strict';
  var U = DM.util, M = DM.model, P = DM.platform, UI = DM.ui, h = U.h;
  var S = DM.screens = {};
  function A() { return DM.app; }
  function D() { return DM.app.data; }
  function T() { return DM.app.today; }

  /* ================================================================ shared pieces */

  function money(n) { return U.fmtMoney(n); }

  function depositLine(dep) {
    return dep.bank + ' · ' + U.maskAccount(dep.accountNumber);
  }

  function depositItem(dep, opts) {
    opts = opts || {};
    var today = T(), m = M.member(D(), dep.memberId), sub;
    if (dep.status === 'Closed') sub = 'Closed' + (dep.closedDate ? ' on ' + U.fmtDate(dep.closedDate) : '');
    else if (!M.hasSchedule(dep)) sub = h('span', { style: 'color:var(--warn);font-weight:600' }, 'Payment dates not set — tap to fix');
    else {
      var sum = M.depositSummary(D(), dep, today);
      if (sum.overdue.length) sub = h('span', { style: 'color:var(--danger);font-weight:600' }, U.plural(sum.overdue.length, 'payment') + ' overdue');
      else if (sum.next) sub = 'Next ' + U.fmtDate(sum.next.dueDate) + ' · ' + money(sum.next.expectedAmount);
      else if (dep.maturityDate && dep.maturityDate < today) sub = h('span', { style: 'color:var(--warn);font-weight:600' }, 'Matured on ' + U.fmtDate(dep.maturityDate) + ' — close it?');
      else sub = dep.maturityDate ? 'Matures ' + U.fmtDate(dep.maturityDate) : '';
    }
    return h('button', { class: 'item', onclick: function () { A().nav.go('deposit/' + dep.id); } },
      h('div', { class: 'avatar' }, UI.initials(m ? m.name : '?')),
      h('div', { class: 'grow' },
        h('div', { class: 't1 ellipsis' }, opts.hideMember ? dep.bank : (m ? m.name : '(Unknown member)')),
        h('div', { class: 't2 ellipsis' }, opts.hideMember ? U.maskAccount(dep.accountNumber) + (dep.village ? ' · ' + dep.village : '') : depositLine(dep)),
        sub ? h('div', { class: 't3 ellipsis' }, sub) : null),
      h('div', { class: 'right' },
        h('div', { class: 'amt' }, money(dep.depositAmount)),
        h('div', { class: 't3' }, dep.status === 'Closed' ? UI.statusChip('Closed') : (dep.frequency || '—'))));
  }

  function dueText(p) {
    var today = T();
    if (p.status === 'Received') return 'Received ' + U.fmtDate(p.receivedDate);
    var n = U.diffDays(today, p.dueDate);
    if (n < 0) return h('span', { style: 'color:var(--danger);font-weight:650' }, 'Overdue by ' + U.plural(-n, 'day'));
    if (n === 0) return h('span', { style: 'color:var(--warn);font-weight:650' }, 'Due today');
    if (n === 1) return 'Due tomorrow';
    return 'Due in ' + n + ' days · ' + U.weekday(p.dueDate);
  }

  function paymentItem(p, opts) {
    opts = opts || {};
    var dep = M.deposit(D(), p.depositId), today = T();
    if (!dep) return null;
    var boxCls = p.status === 'Received' ? 'received' : (p.dueDate < today ? 'overdue' : (p.dueDate === today ? 'today' : ''));
    var right;
    if (p.status === 'Received') {
      right = h('div', { class: 'right' }, h('div', { class: 'amt' }, money(p.receivedAmount)), h('div', { class: 't3' }, UI.statusChip('Received')));
    } else {
      right = h('div', { class: 'right' }, h('div', { class: 'amt' }, money(p.expectedAmount)), h('div', { class: 'mt-8' }, quickReceive(p)));
    }
    var m = M.member(D(), dep.memberId);
    return h('button', {
      class: 'item', onclick: function () {
        if (p.status === 'Received') paymentSheet(p.id); else receiveSheet(p.id);
      }
    },
    UI.dateBox(p.status === 'Received' && opts.byReceived ? p.receivedDate : p.dueDate, boxCls),
    h('div', { class: 'grow' },
      h('div', { class: 't1 ellipsis' }, opts.hideMember ? dep.bank : (m ? m.name : '?')),
      h('div', { class: 't2 ellipsis' }, opts.hideMember ? U.maskAccount(dep.accountNumber) + ' · ' + dep.frequency : depositLine(dep)),
      h('div', { class: 't3 ellipsis' }, opts.history ? ('Due ' + U.fmtDate(p.dueDate) + (+p.receivedAmount !== +p.expectedAmount ? ' · expected ' + money(p.expectedAmount) : '')) : dueText(p))),
    right);
  }

  /** "Received" quick button for payments that are overdue or due within 30 days; a status chip otherwise. */
  function quickReceive(p) {
    if (p.dueDate > U.addDays(T(), 30)) return UI.statusChip(p.status);
    return h('span', {
      class: 'recv-btn', role: 'button', tabindex: '0', 'aria-label': 'Mark as received',
      onclick: function (e) { e.stopPropagation(); receiveSheet(p.id); }
    }, UI.icon('check', 'sm'), 'Received');
  }

  /** Compact row for a deposit's own payment schedule. */
  function scheduleItem(p) {
    var today = T(), rec = p.status === 'Received';
    var boxCls = rec ? 'received' : (p.dueDate < today ? 'overdue' : (p.dueDate === today ? 'today' : ''));
    var n = U.diffDays(today, p.dueDate);
    var t1 = rec ? 'Received ' + U.fmtDate(p.receivedDate)
      : n < 0 ? h('span', { style: 'color:var(--danger)' }, 'Overdue by ' + U.plural(-n, 'day'))
        : n === 0 ? h('span', { style: 'color:var(--warn)' }, 'Due today') : 'Due ' + U.relLong(p.dueDate, today);
    var t2 = rec ? (+p.receivedAmount !== +p.expectedAmount ? 'Expected ' + money(p.expectedAmount) : (p.notes && p.notes !== M.PAST_NOTE ? p.notes : 'Due ' + U.fmtDate(p.dueDate)))
      : U.weekday(p.dueDate) + ', ' + U.fmtDate(p.dueDate);
    return h('button', { class: 'item', onclick: function () { if (rec) paymentSheet(p.id); else receiveSheet(p.id); } },
      UI.dateBox(p.dueDate, boxCls),
      h('div', { class: 'grow' }, h('div', { class: 't1 ellipsis', style: 'font-size:15px' }, t1), h('div', { class: 't3 ellipsis' }, t2)),
      h('div', { class: 'right' }, h('div', { class: 'amt' }, money(rec ? p.receivedAmount : p.expectedAmount)),
        h('div', { class: 'mt-8' }, rec ? UI.statusChip('Received') : quickReceive(p))));
  }

  /** Render a long list in chunks so big histories stay fast. */
  function chunkedList(items, render, pageSize, headFn) {
    var list = h('div', { class: 'list' }), shown = 0;
    pageSize = pageSize || 60;
    function more() {
      var btn = list.querySelector('.more-btn');
      if (btn) btn.remove();
      var end = Math.min(items.length, shown + pageSize);
      for (var i = shown; i < end; i++) {
        if (headFn) { var hd = headFn(items[i], items[i - 1]); if (hd) list.appendChild(hd); }
        var n = render(items[i]);
        if (n) list.appendChild(n);
      }
      shown = end;
      if (shown < items.length) list.appendChild(h('button', { class: 'more-btn', onclick: more }, 'Show more (' + (items.length - shown) + ' left)'));
    }
    more();
    return list;
  }

  function sectionTitle(text, link) {
    return h('div', { class: 'section-title' }, h('span', null, text), link || null);
  }

  function linkBtn(text, fn) { return h('button', { class: 'link', onclick: fn }, text); }

  /* ================================================================ sheets: payments */

  function receiveSheet(pid) {
    var p = M.payment(D(), pid);
    if (!p) return;
    var dep = M.deposit(D(), p.depositId), m = M.member(D(), dep.memberId);
    UI.sheet(function (close) {
      var amt = UI.moneyInput({ value: String(p.expectedAmount), 'aria-label': 'Amount received' });
      var date = UI.input({ type: 'date', value: T() });
      var note = UI.input({ type: 'text', value: p.notes || '', placeholder: 'e.g. credited to savings account' });
      var expWrap = UI.moneyInput({ value: String(p.expectedAmount) });
      var editBox = h('div', { style: 'display:none' },
        UI.field('Expected amount for this payment', expWrap.input, { wrap: expWrap.wrap, hint: 'Only this one payment changes. To change all future payments, edit the deposit.' }),
        h('button', { class: 'btn outline block', onclick: function () {
          var v = U.toNumber(expWrap.input.value);
          if (!(v >= 0)) { UI.toast('Enter a valid amount'); return; }
          M.updatePayment(D(), p.id, { expectedAmount: v });
          A().commit();
          close();
          UI.toast('Expected amount updated');
        } }, 'Save expected amount'));
      return [
        h('h3', null, 'Mark as received'),
        h('div', { class: 'sub' }, (m ? m.name : '') + ' · ' + depositLine(dep)),
        h('div', { class: 'card', style: 'background:var(--surface-2);box-shadow:none' },
          h('div', { class: 'row' },
            h('div', { class: 'grow' }, h('div', { class: 'muted small' }, 'Due date'), h('div', { class: 'strong' }, U.fmtDate(p.dueDate))),
            h('div', { class: 'right' }, h('div', { class: 'muted small' }, 'Expected'), h('div', { class: 'strong num' }, money(p.expectedAmount))))),
        UI.field('Amount received', amt.input, { wrap: amt.wrap }),
        UI.field('Date received', date),
        UI.field('Note', note, { optional: true }),
        h('button', {
          class: 'btn ok block', onclick: function () {
            var v = U.toNumber(amt.input.value);
            if (!(v >= 0)) { UI.toast('Enter the amount received'); amt.input.focus(); return; }
            if (!U.isValidISO(date.value)) { UI.toast('Choose the date received'); return; }
            var nxt = M.markReceived(D(), p.id, { amount: v, date: date.value, notes: note.value }, T());
            A().commit();
            close();
            UI.toast(nxt ? 'Received ✓  Next payment: ' + U.fmtDate(nxt.dueDate) + ' · ' + money(nxt.expectedAmount)
              : 'Received ✓  No more payments scheduled for this deposit', {
              action: 'Undo', onAction: function () { M.markNotReceived(D(), p.id, T()); A().commit(); UI.toast('Undone'); }
            });
          }
        }, UI.icon('check'), 'Mark as received'),
        h('button', { class: 'link mt-12', onclick: function (e) { editBox.style.display = ''; e.target.remove(); } }, 'Change the expected amount instead'),
        editBox
      ];
    });
  }

  function paymentSheet(pid) {
    var p = M.payment(D(), pid);
    if (!p) return;
    var dep = M.deposit(D(), p.depositId), m = M.member(D(), dep.memberId);
    UI.sheet(function (close) {
      var amt = UI.moneyInput({ value: String(p.receivedAmount) });
      var date = UI.input({ type: 'date', value: p.receivedDate });
      var note = UI.input({ type: 'text', value: p.notes || '' });
      var kv = h('div', { class: 'kv' },
        h('div', { class: 'k' }, 'Due date'), h('div', { class: 'v' }, U.fmtDate(p.dueDate)),
        h('div', { class: 'k' }, 'Expected'), h('div', { class: 'v' }, money(p.expectedAmount)),
        h('div', { class: 'k' }, 'Received'), h('div', { class: 'v' }, money(p.receivedAmount)),
        h('div', { class: 'k' }, 'Received on'), h('div', { class: 'v' }, U.fmtDate(p.receivedDate)),
        h('div', { class: 'k' }, 'Payment ID'), h('div', { class: 'v' }, p.id),
        p.notes ? h('div', { class: 'k' }, 'Note') : null, p.notes ? h('div', { class: 'v' }, p.notes) : null);
      var edit = h('div', { style: 'display:none', class: 'mt-16' },
        UI.field('Amount received', amt.input, { wrap: amt.wrap }),
        UI.field('Date received', date),
        UI.field('Note', note, { optional: true }),
        h('button', { class: 'btn primary block', onclick: function () {
          var v = U.toNumber(amt.input.value);
          if (!(v >= 0) || !U.isValidISO(date.value)) { UI.toast('Check the amount and date'); return; }
          M.updatePayment(D(), p.id, { receivedAmount: v, receivedDate: date.value, notes: note.value });
          A().commit();
          close();
          UI.toast('Payment updated');
        } }, 'Save changes'));
      var actions = h('div', { class: 'btn-row mt-16' },
        h('button', { class: 'btn outline', onclick: function () { edit.style.display = ''; actions.style.display = 'none'; } }, UI.icon('edit', 'sm'), 'Edit'),
        h('button', { class: 'btn danger', onclick: function () {
          UI.confirm('Mark as not received?', 'Use this if it was marked by mistake. The payment goes back to ' +
            (p.dueDate < T() ? 'overdue.' : 'pending.'), 'Mark not received').then(function (ok) {
            if (!ok) return;
            M.markNotReceived(D(), p.id, T());
            A().commit();
            close();
            UI.toast('Marked as not received');
          });
        } }, 'Not received'));
      return [
        h('h3', null, 'Payment received'),

<script>
/* Deposit Manager — start-up. */
(function (DM) {
  'use strict';
  function fatal(msg) {
    var main = document.getElementById('main');
    if (!main) return;
    main.innerHTML = '';
    var box = document.createElement('div');
    box.style.cssText = 'padding:24px;margin:16px;border-radius:16px;background:#fce8e6;color:#5c1410;font-family:sans-serif';
    box.innerHTML = '<b>The app could not start.</b><br><br>';
    box.appendChild(document.createTextNode(String(msg)));
    main.appendChild(box);
  }
  window.addEventListener('error', function (e) {
    if (!DM.app || !document.getElementById('bar') || !document.getElementById('bar').firstChild) fatal(e.message || e);
  });
  function boot() {
    try {
      if (!window.JSZip) throw new Error('A required part (zip library) is missing from this file.');
      DM.app.start();
    } catch (e) {
      fatal(e && e.message || e);
      throw e;
    }
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})(window.DM = window.DM || {});

</script>
